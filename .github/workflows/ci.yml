name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1 -Profile Merge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: target/verification

  c-frontend-conformance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Clang oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -LiteralPath crates/fossilsense/tests/fixtures/c_frontend/manifest.json | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP 'fossilsense-llvm-installer.exe'
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'fossilsense-llvm'
          Invoke-WebRequest -Uri $manifest.installerUrl -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $manifest.installerSha256) {
            throw 'Pinned LLVM installer SHA-256 mismatch.'
          }
          $installed = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$llvmRoot") -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Pinned LLVM installation failed.' }
          $clangPath = Join-Path $llvmRoot 'bin/clang.exe'
          if (-not (Test-Path -LiteralPath $clangPath -PathType Leaf)) { throw 'Pinned Clang is missing.' }
          "FOSSILSENSE_CLANG=$clangPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare complete source declarations
        shell: pwsh
        run: node scripts/verify_c_frontend_conformance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c-frontend-conformance
          path: target/c-frontend-conformance
